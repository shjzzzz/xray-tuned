name: Build release installers

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 产物校验。
  #
  # 构建脚本只是把 src/*.sh 按 @@include 拼接起来，本身不做任何检查：
  # src 里一个语法错误会原样进入 dist/install.sh，构建仍然退出 0，
  # CI 显示成功，Release 照常发布，用户装到的是一个跑不起来的脚本。
  # 这里补上最基本的两道关，并让 build-release 依赖本 job。
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # build-install.sh 从 tag 取 xh 版本号，浅克隆没有 tag

      - name: 安装 shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: 构建安装器（dist 未入库，需先生成）
        run: |
          set -euo pipefail
          bash .github/scripts/build-install.sh
          bash .github/scripts/build-dual-cdn.sh
          bash .github/scripts/build-dual-ip.sh
          bash .github/scripts/build-quic.sh
          bash .github/scripts/build-quic-h3.sh

      - name: bash -n 语法检查（源码与产物）
        run: |
          set -euo pipefail
          for f in src/*.sh src/*/*.sh extensions/*/*.sh .github/scripts/*.sh dist/*.sh; do
            [ -e "$f" ] || continue
            bash -n "$f" || { echo "语法错误: $f"; exit 1; }
          done
          echo "OK: 全部脚本通过 bash -n"

      - name: ShellCheck（只让 error 级问题失败）
        run: |
          set -euo pipefail
          # 风格类告警在本项目里大量属于有意为之，只拦真正会导致运行期
          # 错误的问题。例如 SC2168（local 用在函数外）——它在 set -e 下
          # 会让脚本就地中止，正是这道关要挡住的那类事故。
          shellcheck -S error dist/*.sh
          echo "OK: ShellCheck 无 error 级问题"

  build-release:
    needs: validate
    runs-on: ubuntu-latest
    # 串行发布：main 推送也会发布到「最新 tag」的 Release，同时推 main 与 tag 时两个 run 会
    # 并发覆盖同一 Release 的附件（overwrite_files 先删后传），互相踩踏导致附件缺失、run 报 404
    # （2026-11-16 v5.6.8 实际发生）。所有会发布的 run 共用一个组排队；不取消正在跑的。
    # PR 不发布，按 run_id 各自成组，不参与排队。
    # 注意：同组最多一个运行 + 一个排队，更新的排队 run 会顶掉更早的排队 run（GitHub 行为）；
    # 若被顶掉的是 tag run，后来的 main run 会解析到同一个最新 tag 并完成发布（附件来自 main 的构建）。
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.run_id) || 'release-publish' }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # build-install.sh 从 tag 取 xh 版本号，浅克隆没有 tag

      - name: Build installers
        run: bash .github/scripts/build-install.sh

      - name: Build dual CDN extension
        run: bash .github/scripts/build-dual-cdn.sh

      - name: Build dual IP extension
        run: bash .github/scripts/build-dual-ip.sh

      - name: Build QUIC extension
        run: bash .github/scripts/build-quic.sh

      - name: Build QUIC H3 extension
        run: bash .github/scripts/build-quic-h3.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installers
          path: |
            dist/install.sh
            dist/install-xpadding.sh
            dist/add-dual-cdn.sh
            dist/add-dual-ip.sh
            dist/add-quic.sh
            dist/add-quic-h3.sh
            dist/xh

      - name: Resolve release tag
        id: release_tag
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            git fetch --tags --force
            tag=$(git tag --sort=-v:refname | head -n1)
            [[ -n "$tag" ]] || tag="v5.6.1"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            dist/install.sh
            dist/install-xpadding.sh
            dist/add-dual-cdn.sh
            dist/add-dual-ip.sh
            dist/add-quic.sh
            dist/add-quic-h3.sh
            dist/xh
